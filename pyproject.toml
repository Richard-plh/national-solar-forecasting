[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "national-solar-forecasting"
version = "1.0.0"
description = "Reproducible short-term national-level Solar Generation forecasting with multi-scale GRU models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
solar-forecast = "solar_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
